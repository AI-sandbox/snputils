# File: .github/workflows/release.yml
# This workflow handles:
# 1. For Pull Requests:
#    - Runs all tests
#    - Verifies documentation builds
#    - Builds and smoke-tests wheels on every supported platform
# 2. For Pre-releases:
#    - Runs all tests
#    - Builds documentation
#    - Publishes the tested wheels and source distribution to PyPI
#    - Updates the release to a full release (removes pre-release status) and marks latest
#    - Deploys documentation to GitHub Pages (at the end; non-blocking)

name: Test, Docs & Publish

on:
  # Run on pushes to the docs branch (verify tests and docs build)
  push:
    branches:
      - docs
  # Run on pull requests to main branch to verify changes
  pull_request:
    branches:
      - main
  # Run when a new release is published to deploy docs and package
  release:
    types: [published]

permissions:
  contents: write   # Needed to update release status
  pages: write      # Needed for docs deployment
  id-token: write   # Needed for docs deployment

jobs:
  test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/docs') || (github.event_name == 'release' && github.event.release.prerelease == true)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.14']  # Test on limit versions (3.9 and latest)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full repository history, including all tags

      - name: Verify available tags
        run: git tag -l

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"           # Enables automatic pip caching

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      # Cache test data
      - name: Cache test data
        uses: actions/cache@v5
        with:
          path: data/
          key: snputils-test-data-${{ hashFiles('snputils/snp/io/read/__test__/conftest.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions

      - name: Run tests
        run: python -m tox

  build-docs:
    # Only build documentation after tests have passed
    needs: test
    if: needs.test.result == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/docs') || (github.event_name == 'release' && github.event.release.prerelease == true))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full repository history, including all tags

      - name: Verify available tags
        run: git tag -l

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'  # Ensure this is the latest Python version so the cached deps are used
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Install package with docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[docs]'

      # Build documentation and verify it builds correctly
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check documentation links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck

      # Upload Pages artifact if this is a release
      - name: Upload Pages artifact
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  build-wheels:
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.release.prerelease == true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            artifact: wheels-linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            artifact: wheels-linux-aarch64
          - runner: macos-14
            arch: arm64
            artifact: wheels-macos-arm64
          - runner: macos-15-intel
            arch: x86_64
            artifact: wheels-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and smoke-test wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [test, build-docs, build-wheels]
    if: needs.build-docs.result == 'success' && needs.build-wheels.result == 'success' && github.event_name == 'release' && github.event.release.prerelease == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full repository history, including all tags

      - name: Verify available tags
        run: git tag -l

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'  # Ensure this is the latest Python version so the cached deps are used
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Download tested wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      # Update the release to a full release and mark it as latest
      - name: Mark Release as Final and Latest
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.event.release.tag_name }} --prerelease=false --latest

  deploy-pages:
    needs: [build-docs, publish]
    if: needs.build-docs.result == 'success' && needs.publish.result == 'success' && github.event_name == 'release' && github.event.release.prerelease == true
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy documentation to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
